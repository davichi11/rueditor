[package]
name = "rueditor"
version = "0.1.0"
edition = "2024"
default-run = "rueditor"
description = "A lightweight native text editor built with GPUI Kit"

[dependencies]
tempfile = "3.27"
gpui-kit = { version = "0.8.0", features = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-markdown",
    "tree-sitter-toml",
    "tree-sitter-yaml",
] }
jsonrepair = "0.1.0"
serde_json = "1"
regex = "1"

[dev-dependencies]
gpui-kit = { version = "0.8.0", features = ["test-support"] }
# 预览用的 Markdown 语法树来自 markdown-rs，这里直接复用同一份解析器做断言。
markdown = "1.0.0"

[[bin]]
name = "rueditor"
path = "src/bin/rueditor.rs"
